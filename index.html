<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <title>RN42 LIVE 3D — Tournoi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js" defer></script>
  <style>
    :root {
      --red:#ff1e42; --cyan:#00f0ff; --gold:#ffd700; --green:#58d68d;
      --bg:#07090e; --panel:#11141b; --panel2:#161a23; --line:rgba(255,255,255,.1);
      --text:#e8ecf4; --muted:#8a93a6; --radius:16px;
      color-scheme:dark;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; color:var(--text);
      font-family:Inter,system-ui,sans-serif;
      background:
        radial-gradient(900px 500px at 85% -10%,rgba(255,30,66,.18),transparent),
        radial-gradient(800px 500px at -10% 10%,rgba(0,240,255,.12),transparent),
        var(--bg);
    }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .shell { width:min(1100px,calc(100% - 32px)); margin:auto; }
    header {
      height:58px; border-bottom:1px solid var(--line); background:rgba(7,9,14,.8);
      backdrop-filter:blur(16px); position:sticky; top:0; z-index:30;
    }
    .header-inner { height:100%; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { display:none; }
    .brand-name { font-family:Orbitron,Inter,sans-serif; font-size:22px; line-height:1; letter-spacing:.04em; font-weight:800; }
    .brand-name span { color:var(--red); }
    .brand-sub { margin-top:5px; color:var(--muted); font-size:10px; letter-spacing:1.7px; text-transform:uppercase; }
    main { padding:24px 0 48px; }
    .tabs {
      display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar { display:none; }
    .tab {
      border:1px solid var(--line);       background:rgba(255,255,255,.05); color:var(--text);
      min-height:42px; border-radius:12px; padding:0 15px; white-space:nowrap; transition:.2s;
      font-size:13px; font-weight:700;
    }
    .tab:hover { color:#fff; border-color:rgba(101,232,255,.35); }
    .tab.active { color:#fff; background:var(--red); border-color:var(--red); box-shadow:0 8px 24px rgba(255,59,84,.18); }
    .btn {
      min-height:40px; border-radius:10px; border:1px solid var(--line); background:var(--panel2);
      color:#fff; padding:0 13px; font-weight:700; transition:.18s;
    }
    .btn:hover { transform:translateY(-1px); border-color:rgba(101,232,255,.45); }
    .btn.primary { background:var(--red); border-color:var(--red); }
    .btn.cyan { color:var(--cyan); }
    .btn.small { min-height:32px; padding:0 9px; font-size:12px; }
    .btn.danger { color:#ff7a8a; }
    .card {
      background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
      border:1px solid var(--line); border-radius:var(--radius); padding:18px;
    }
    .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:16px; }
    h1,h2,h3 { margin:0; font-family:Orbitron,Inter,sans-serif; letter-spacing:.04em; }
    h1 { font-size:27px; } h2 { font-size:21px; } h3 { font-size:16px; }
    .eyebrow { color:var(--muted); text-transform:uppercase; letter-spacing:1.6px; font-size:10px; margin-bottom:5px; }
    .muted { color:var(--muted); }
    .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .spacer { flex:1; }
    input,select {
      height:42px; min-width:0; border:1px solid var(--line); border-radius:10px;
      background:#0d1016; color:#fff; padding:0 11px;
    }
    input:focus,select:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(101,232,255,.08); }
    .field { flex:1 1 180px; }
    .avatar {
      width:44px; height:44px; flex:none; border-radius:50%; object-fit:cover;
      border:2px solid rgba(101,232,255,.7); background:#202631;
      display:grid; place-items:center; font-family:Orbitron,Inter,sans-serif; color:var(--cyan);
    }
    .pilot-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
    .pilot {
      min-height:74px; display:flex; align-items:center; gap:12px; position:relative;
      border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.025);
      padding:12px; transition:.18s;
    }
    .pilot:hover { border-color:rgba(255,59,84,.5); transform:translateY(-2px); }
    .pilot-name { font-family:Orbitron,Inter,sans-serif; font-size:14px; letter-spacing:.04em; }
    .pilot-sub { color:var(--muted); font-size:12px; margin-top:3px; }
    .delete {
      position:absolute; right:8px; top:8px; width:26px; height:26px; border:0; border-radius:8px;
      background:rgba(255,59,84,.1); color:#ff7a8a;
    }
    .avatar-picker { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .avatar-option { width:42px; height:42px; border:1px solid var(--line); border-radius:50%; object-fit:cover; }
    .salon-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px; }
    .salon-title { color:var(--cyan); display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .slot {
      min-height:58px; display:flex; align-items:center; gap:8px;
      border-top:1px solid var(--line); padding:8px 0;
    }
    .slot .tag { min-width:0; flex:1; font-family:Orbitron,Inter,sans-serif; font-size:14px; overflow:hidden; text-overflow:ellipsis; }
    .slot select { width:78px; height:36px; }
    .slot input { width:92px; height:36px; }
    .rank-badge { min-width:52px; text-align:center; border-radius:999px; background:#202532; padding:5px 8px; font-size:12px; }
    .rank-badge.gold { background:var(--gold); color:#16120a; }
    .tree-scroll { overflow-x:auto; padding:10px 2px 18px; }
    .tree { display:flex; align-items:center; gap:28px; min-width:760px; }
    .bracket-col { display:flex; flex-direction:column; gap:10px; min-width:190px; }
    .bracket-salon { padding:10px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); }
    .mini-pilot { display:flex; align-items:center; gap:7px; min-height:29px; font-size:12px; }
    .mini-pilot.winner { color:var(--gold); font-weight:700; }
    .arrow { color:var(--cyan); font-size:27px; }
    .champion-box { min-width:180px; text-align:center; padding:16px; border:1px solid rgba(255,200,87,.55); border-radius:16px; box-shadow:0 0 30px rgba(255,200,87,.08); }
    .champion-name { color:var(--gold); font-family:Orbitron,Inter,sans-serif; font-size:20px; margin-top:8px; }
    .final-list { display:grid; gap:8px; }
    .podium { display:flex; align-items:flex-end; justify-content:center; gap:12px; min-height:300px; padding:16px 0 0; }
    .step { width:190px; max-width:30%; text-align:center; }
    .step-avatar { width:76px; height:76px; }
    .block { margin-top:10px; border-radius:12px 12px 0 0; display:flex; justify-content:center; padding-top:12px; color:#111; font-family:Orbitron,Inter,sans-serif; font-size:30px; }
    .block.gold { background:var(--gold); } .block.silver { background:#c4cad3; } .block.bronze { background:#c18453; }
    table { width:100%; border-collapse:collapse; }
    th,td { border-top:1px solid var(--line); padding:11px 8px; text-align:left; font-size:12px; }
    th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.8px; }
    .table-wrap { overflow-x:auto; }
    .modal-backdrop {
      position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:16px;
      background:rgba(3,5,8,.82); backdrop-filter:blur(8px);
    }
    .modal { width:min(390px,100%); background:#121620; border:1px solid rgba(255,59,84,.45); border-radius:18px; padding:18px; box-shadow:0 30px 100px #000; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
    .profile-modal { width:min(360px,100%); text-align:center; }
    .profile-modal .avatar { width:104px; height:104px; margin:12px auto 8px; font-size:26px; }
    .profile-grid { display:grid; grid-template-columns:1fr auto; gap:8px 18px; margin:16px 0; text-align:left; font-size:13px; }
    .profile-grid dt { color:var(--muted); } .profile-grid dd { margin:0; font-weight:700; }
    .toasts { position:fixed; right:16px; bottom:16px; z-index:100; display:flex; flex-direction:column; gap:8px; }
    .toast { min-width:220px; background:#171c27; border-left:3px solid var(--cyan); border-radius:9px; padding:12px 14px; box-shadow:0 12px 30px #0009; animation:toast-in .22s; }
    @keyframes toast-in { from { opacity:0; transform:translateX(20px); } }
    .empty { border:1px dashed var(--line); border-radius:14px; padding:38px 20px; text-align:center; color:var(--muted); }
    .capturing .no-capture { display:none !important; }
    @media (max-width:700px) {
      .shell { width:min(100% - 20px,1180px); }
      header { height:68px; } .brand-sub { display:none; } .brand-name { font-size:18px; }
      main { padding-top:14px; } .tabs { margin-right:-10px; }
      .card { padding:14px; } .card-head { align-items:center; }
      .pilot-grid { grid-template-columns:1fr; } .salon-grid { grid-template-columns:1fr; }
      .podium { min-height:250px; } .step { max-width:31%; } .step-avatar { width:58px; height:58px; }
      .block { height:var(--mobile-height,90px) !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell header-inner">
      <div class="brand">
        <div><div class="brand-name">RN42 LIVE <b style="color:var(--red)">3D</b> <span style="color:var(--cyan)">·</span> TOURNOI</div><div class="brand-sub">TRÊKA STUDIO · FIANARANTSOA → IKALAMAVONY</div></div>
      </div>
      <button class="btn small" id="adminButton">🔑 Admin</button>
    </div>
  </header>
  <main class="shell">
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <section id="view"></section>
  </main>
  <div class="toasts" id="toasts"></div>
  <div id="modal"></div>

  <script>
    const PIN = "1234";
    const tabs = ["Pilotes","Salons","Arbre","Grande finale","Podium"];
    const emojis = ["🏎️","🏁","🚗","⚡","🔥","🦅","🐺","👑"];
    const colors = ["#ff1e42","#00f0ff","#ffd700","#8a2be2","#00c853","#ff6d00","#2979ff","#e91e63"];
    const defaultState = { pilots:[], salons:[], tab:1, final:false, validated:false };
    let state = { pilots:[], salons:[], tab:1, final:false, validated:false };
    let admin = false;
    let pendingAvatar = null;

    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[char]));
    const safeNumber = value => { const n = Number(value); return Number.isFinite(n) ? n : 0; };
    const $ = selector => document.querySelector(selector);
    const pilotById = id => state.pilots.find(pilot => pilot.id === id);
    const deepClone = value => JSON.parse(JSON.stringify(value));

    try {
      const saved = JSON.parse(localStorage.getItem("rn42-live") || localStorage.getItem("rn42"));
      if (saved && typeof saved === "object") state = { ...deepClone(defaultState), ...saved };
      if (!Array.isArray(state.pilots)) state.pilots = [];
      if (!Array.isArray(state.salons)) state.salons = [];
    } catch (_) {}

    async function loadJsonDatabase() {
      if (state.pilots.length || state.salons.length) return;
      try {
        const response = await fetch("./rn42-data.json", { cache:"no-store" });
        if (!response.ok) return;
        const database = await response.json();
        if (!Array.isArray(database.pilots) || !Array.isArray(database.salons)) return;
        state = { ...deepClone(defaultState), ...database, tab:safeNumber(database.tab) };
        save();
        render();
        toast("Base JSON chargée");
      } catch (_) {}
    }

    function save() {
      try { localStorage.setItem("rn42-live", JSON.stringify(state)); localStorage.setItem("rn42", JSON.stringify(state)); } catch (_) { toast("Stockage local indisponible"); }
    }
    function toast(message) {
      const node = document.createElement("div");
      node.className = "toast"; node.textContent = message;
      $("#toasts").append(node);
      setTimeout(() => node.remove(), 2800);
    }
    function closeModal() { $("#modal").innerHTML = ""; }
    function confirmDialog(message, action) {
      $("#modal").innerHTML = `<div class="modal-backdrop"><div class="modal"><h3>Confirmation</h3><p class="muted">${esc(message)}</p><div class="modal-actions"><button class="btn" id="cancelConfirm">Annuler</button><button class="btn primary" id="acceptConfirm">Confirmer</button></div></div></div>`;
      $("#cancelConfirm").onclick = closeModal;
      $("#acceptConfirm").onclick = () => { closeModal(); action(); };
    }
    function adminToggle() {
      if (admin) { admin = false; render(); toast("Mode administrateur désactivé"); return; }
      $("#modal").innerHTML = `<div class="modal-backdrop" id="loginBackdrop"><div class="modal"><div class="eyebrow">Espace privé</div><h2>Connexion administrateur</h2><p class="muted">Entrez le code PIN.</p><input id="pin" type="password" inputmode="numeric" style="width:100%" autocomplete="current-password" placeholder="Code PIN"><div class="modal-actions"><button class="btn" id="cancelLogin">Annuler</button><button class="btn primary" id="loginSubmit">Connexion</button></div></div></div>`;
      $("#cancelLogin").onclick = closeModal;
      $("#loginBackdrop").onclick = event => { if (event.target === event.currentTarget) closeModal(); };
      const submit = () => {
        if ($("#pin").value === PIN) { admin = true; closeModal(); render(); toast("Mode administrateur activé"); }
        else toast("Code PIN incorrect");
      };
      $("#loginSubmit").onclick = submit;
      $("#pin").onkeydown = event => { if (event.key === "Enter") submit(); };
      setTimeout(() => $("#pin")?.focus(), 0);
    }

    function makeAvatar(index) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 160;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createLinearGradient(0,0,160,160);
      gradient.addColorStop(0, colors[index % colors.length]); gradient.addColorStop(1,"#11151d");
      ctx.fillStyle = gradient; ctx.fillRect(0,0,160,160);
      ctx.font = "86px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(emojis[index % emojis.length],80,88);
      return canvas.toDataURL("image/jpeg",.82);
    }
    function avatar(pilot, size=44) {
      if (pilot.photo) return `<img class="avatar" style="width:${size}px;height:${size}px" src="${esc(pilot.photo)}" alt="${esc(pilot.tag)}">`;
      return `<span class="avatar" style="width:${size}px;height:${size}px">${esc(pilot.tag.slice(0,2).toUpperCase())}</span>`;
    }
    function ordinal(n) { return n ? (n === 1 ? "1er" : n + "e") : "—"; }
    function go(tab) { state.tab = tab; save(); render(); }
    function render() {
      $("#adminButton").textContent = admin ? "🔓 Déconnexion" : "🔑 Admin";
      $("#tabs").innerHTML = tabs.map((tab,index) => `<button class="tab ${state.tab===index?"active":""}" onclick="go(${index})">${index+1}. ${index===1?"Salons 5×5":index===3?"Finale Top 5":tab}</button>`).join("");
      const views = [renderPilots,renderSalons,renderTree,renderFinal,renderPodium];
      $("#view").innerHTML = views[state.tab]();
    }

    function renderPilots() {
      const form = admin ? `<div class="card" style="margin-bottom:14px"><div class="card-head"><div><div class="eyebrow">Administration</div><h2>Inscrire un pilote</h2></div></div>
        <div class="row"><input class="field" id="pilotName" maxlength="60" placeholder="Nom & prénom"><input class="field" id="pilotTag" maxlength="18" placeholder="Nom de guerre"></div>
        <div class="row" style="margin-top:12px"><img id="avatarPreview" class="avatar" style="display:none;width:48px;height:48px" alt=""><label class="btn small" style="display:grid;place-items:center">Ajouter une photo<input type="file" accept="image/*" hidden onchange="loadPhoto(this)"></label><div class="avatar-picker">${emojis.map((_,i)=>`<img class="avatar-option" src="${makeAvatar(i)}" onclick="chooseAvatar(${i})" alt="Avatar ${i+1}">`).join("")}</div></div>
        <div class="row" style="margin-top:14px"><button class="btn primary" onclick="addPilot()">Inscrire le pilote</button><button class="btn cyan" onclick="addDemo()">Ajouter 15 pilotes</button><div class="spacer"></div><button class="btn cyan" onclick="exportJson()">Exporter JSON</button><label class="btn" style="display:grid;place-items:center">Importer JSON<input type="file" accept=".json,application/json" hidden onchange="importJson(this)"></label><button class="btn danger" onclick="confirmDialog('Réinitialiser complètement le tournoi ?',resetTournament)">Réinitialiser</button></div></div>` : "";
      return `${form}<div class="card-head"><div><div class="eyebrow">${state.pilots.length} participant${state.pilots.length>1?"s":""}</div><h1>Pilotes engagés</h1></div></div>${state.pilots.length?`<div class="pilot-grid">${state.pilots.map(pilot=>`<article class="pilot" onclick="openProfile(${pilot.id})">${avatar(pilot)}<div style="min-width:0"><div class="pilot-name">${esc(pilot.tag)}</div><div class="pilot-sub">${esc(pilot.name)}</div></div>${admin?`<button class="delete" onclick="event.stopPropagation();deletePilot(${pilot.id})" aria-label="Supprimer">×</button>`:""}</article>`).join("")}</div>`:`<div class="empty">Aucun pilote inscrit pour le moment.</div>`}`;
    }
    function loadPhoto(input) {
      const file = input.files?.[0]; if (!file) return;
      if (file.size > 8 * 1024 * 1024) return toast("Photo trop volumineuse");
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          const size = Math.min(image.width,image.height);
          const canvas = document.createElement("canvas"); canvas.width = canvas.height = 160;
          canvas.getContext("2d").drawImage(image,(image.width-size)/2,(image.height-size)/2,size,size,0,0,160,160);
          pendingAvatar = canvas.toDataURL("image/jpeg",.78);
          $("#avatarPreview").src = pendingAvatar; $("#avatarPreview").style.display = "block";
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    function chooseAvatar(index) { pendingAvatar = makeAvatar(index); $("#avatarPreview").src = pendingAvatar; $("#avatarPreview").style.display = "block"; }
    function exportJson() {
      const orderedPilots = typeof ranking === "function" ? ranking() : [...state.pilots];
      const database = {
        version:1,
        event:{
          name:"RN42 LIVE 3D — Tournoi",
          studio:"TRÊKA STUDIO",
          route:"FIANARANTSOA → IKALAMAVONY"
        },
        updatedAt:new Date().toISOString(),
        tab:state.tab,
        final:Boolean(state.final),
        validated:Boolean(state.validated),
        pilots:deepClone(state.pilots),
        salons:deepClone(state.salons),
        ranking:orderedPilots.map((pilot,index)=>({
          place:index+1,
          id:pilot.id,
          name:pilot.name,
          tag:pilot.tag,
          photo:pilot.photo || null,
          salon:salonIndex(pilot.id)>=0?salonIndex(pilot.id)+1:null,
          salonRank:pilot.sr || null,
          salonTime:pilot.st || null,
          finalRank:pilot.fr || null,
          finalTime:pilot.ft || null,
          status:pilotStatus(pilot)
        }))
      };
      const blob = new Blob([JSON.stringify(database,null,2)], { type:"application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href=url;
      link.download="rn42-data.json";
      link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast("Base JSON exportée");
    }
    async function importJson(input) {
      const file=input.files?.[0]; if(!file)return;
      if(file.size>25*1024*1024)return toast("Fichier JSON trop volumineux");
      try {
        const database=JSON.parse(await file.text());
        if(!Array.isArray(database.pilots)||!Array.isArray(database.salons))throw new Error("Structure invalide");
        const pilots=database.pilots.filter(pilot=>pilot&&typeof pilot.name==="string"&&typeof pilot.tag==="string").map(pilot=>({
          id:typeof pilot.id==="string"||typeof pilot.id==="number"?pilot.id:Date.now()+Math.floor(Math.random()*10000),
          name:pilot.name.trim(),
          tag:pilot.tag.trim().toUpperCase(),
          photo:typeof pilot.photo==="string"?pilot.photo:null,
          sr:Number.isInteger(pilot.sr)?pilot.sr:null,
          st:typeof pilot.st==="string"?pilot.st:"",
          fr:Number.isInteger(pilot.fr)?pilot.fr:null,
          ft:typeof pilot.ft==="string"?pilot.ft:""
        }));
        const validIds=new Set(pilots.map(pilot=>pilot.id));
        const salons=database.salons.map(salon=>Array.isArray(salon)?salon.filter(id=>validIds.has(id)):[]).filter(salon=>salon.length);
        state={...deepClone(defaultState),pilots,salons,tab:safeNumber(database.tab),final:Boolean(database.final),validated:Boolean(database.validated)};
        save();
        render();
        toast("Base JSON importée");
      } catch (_) {
        toast("Fichier JSON invalide");
      } finally {
        input.value="";
      }
    }
    function addPilot() {
      const name = $("#pilotName").value.trim();
      const tag = $("#pilotTag").value.trim().replace(/\s+/g," ").toUpperCase();
      if (!name || !tag) return toast("Nom et nom de guerre requis");
      if (state.pilots.some(pilot => pilot.tag.toUpperCase() === tag)) return toast("Ce nom de guerre existe déjà");
      state.pilots.push({ id:Date.now()+Math.floor(Math.random()*10000), name, tag, photo:pendingAvatar, sr:null, st:"", fr:null, ft:"" });
      pendingAvatar = null; save(); render(); toast("Pilote inscrit");
    }
    function addDemo() {
      const names = ["Rakoto Jean","Rabe Andry","Rasoa Miora","Randria Tojo","Hery Fanilo","Ando Mamy","Lanto Rivo","Faly Tsiry","Nirina Koto","Zo Hasina","Mbola Dina","Tiana Fidy","Voahangy Ny","Bako Lova","Toky Safidy"];
      const tags = ["NITRO","VIPER","ZEBU","RN42KING","TSIRY","DRIFTER","LEMUR","BAOBAB","TURBO","FANTOME","RALLYX","ECLAIR","COBRA","MADA","STORM"];
      names.forEach((name,index) => {
        if (!state.pilots.some(pilot => pilot.tag === tags[index])) state.pilots.push({ id:Date.now()+index*100,name,tag:tags[index],photo:makeAvatar(index),sr:null,st:"",fr:null,ft:"" });
      });
      save(); render(); toast("15 pilotes ajoutés");
    }
    function deletePilot(id) {
      confirmDialog("Supprimer définitivement ce pilote ?",()=> {
        state.pilots = state.pilots.filter(pilot => pilot.id !== id);
        state.salons = state.salons.map(salon => salon.filter(pilotId => pilotId !== id)).filter(salon => salon.length);
        state.validated = false; save(); render();
      });
    }
    function resetTournament() { state = deepClone(defaultState); pendingAvatar = null; save(); render(); toast("Tournoi réinitialisé"); }

    function generateSalons() {
      if (state.pilots.length < 2) return toast("Inscrivez au moins 2 pilotes");
      const ids = state.pilots.map(pilot => pilot.id);
      for (let i=ids.length-1;i>0;i--) { const j=Math.floor(Math.random()* (i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
      state.salons=[]; for (let i=0;i<ids.length;i+=5) state.salons.push(ids.slice(i,i+5));
      state.pilots.forEach(pilot => { pilot.sr=null; pilot.st=""; pilot.fr=null; pilot.ft=""; });
      state.final=false; state.validated=false; save(); render(); toast("Salons générés");
    }
    function renderSalons() {
      const control = admin ? `<button class="btn ${state.salons.length?"cyan":"primary"}" onclick="${state.salons.length?"confirmDialog('Remélanger les salons ? Tous les résultats seront effacés.',generateSalons)":"generateSalons()"}">${state.salons.length?"Remélanger":"Générer les salons"}</button>` : "";
      if (!state.salons.length) return `<div class="card-head"><div><div class="eyebrow">Phase qualificative</div><h1>Salons de qualification</h1></div>${control}</div><div class="empty">Aucun salon généré pour le moment.</div>`;
      return `<div class="card-head"><div><div class="eyebrow">Phase qualificative</div><h1>Salons de qualification</h1></div>${control}</div><div class="salon-grid">${state.salons.map((salon,index)=>`<article class="card" id="salon-${index}"><div class="salon-title"><h3>SALON ${index+1}</h3><button class="btn small cyan no-capture" onclick="capture('salon-${index}','salon-${index+1}')">PNG</button></div>${salon.map(id=>{const pilot=pilotById(id); if(!pilot)return ""; return `<div class="slot" onclick="openProfile(${id})">${avatar(pilot,34)}<span class="tag">${esc(pilot.tag)}</span>${admin?`<select onclick="event.stopPropagation()" onchange="setResult(${id},'sr',this.value)"><option value="">Rang</option>${[1,2,3,4,5].map(n=>`<option ${pilot.sr===n?"selected":""} value="${n}">${ordinal(n)}</option>`).join("")}</select><input onclick="event.stopPropagation()" aria-label="Chrono" placeholder="0:00.0" value="${esc(pilot.st)}" onchange="setResult(${id},'st',this.value)"><button class="btn small no-capture" onclick="event.stopPropagation();setWinner(${id})">🏆</button>`:`<span class="rank-badge ${pilot.sr===1?"gold":""}">${ordinal(pilot.sr)}</span><span class="muted">${esc(pilot.st||"—")}</span>`}</div>`}).join("")}</article>`).join("")}</div>`;
    }
    function setResult(id,key,value) { const pilot=pilotById(id); if(!pilot)return; pilot[key]=(key==="st"||key==="ft")?value.trim():value?Number(value):null; state.validated=false; save(); }
    function setWinner(id) {
      const salonIndex = state.salons.findIndex(salon => salon.includes(id));
      if (salonIndex < 0) return;
      state.salons[salonIndex].forEach(pilotId => { const pilot=pilotById(pilotId); if(pilot?.sr===1) pilot.sr=null; });
      const pilot=pilotById(id); pilot.sr=1; state.validated=false; save(); render(); toast(pilot.tag+" qualifié");
    }

    function parseTime(value) {
      const match=String(value||"").trim().match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
      return match ? (safeNumber(match[1])*60)+safeNumber(match[2]) : 999999;
    }
    function finalists() {
      const winners=[],seconds=[];
      state.salons.forEach(salon => salon.forEach(id=> {
        const pilot=pilotById(id); if(!pilot)return;
        if(pilot.sr===1) winners.push(pilot); else if(pilot.sr===2) seconds.push(pilot);
      }));
      winners.sort((a,b)=>parseTime(a.st)-parseTime(b.st));
      seconds.sort((a,b)=>parseTime(a.st)-parseTime(b.st));
      return winners.concat(seconds).slice(0,5);
    }
    function salonIndex(id) { return state.salons.findIndex(salon=>salon.includes(id)); }
    function renderTree() {
      if (!state.salons.length) return `<div class="empty">Générez les salons avant d’afficher l’arbre.</div>`;
      const final = finalists();
      const champion = state.validated ? final.find(pilot=>pilot.fr===1) : null;
      return `<div class="card" id="tree"><div class="card-head"><div><div class="eyebrow">Tableau éliminatoire</div><h1>Arbre du tournoi</h1></div><button class="btn small cyan no-capture" onclick="capture('tree','arbre-rn42')">Télécharger PNG</button></div><div class="tree-scroll"><div class="tree"><div class="bracket-col">${state.salons.map((salon,index)=>`<div class="bracket-salon"><div class="eyebrow" style="color:var(--cyan)">Salon ${index+1}</div>${salon.map(id=>{const pilot=pilotById(id); return pilot?`<div class="mini-pilot ${pilot.sr===1?"winner":""}">${pilot.sr===1?"◆":"•"} ${esc(pilot.tag)} <span class="muted">${pilot.sr?ordinal(pilot.sr):""}</span></div>`:""}).join("")}</div>`).join("")}</div><span class="arrow">→</span><div class="bracket-col"><div class="card"><div class="eyebrow" style="color:var(--gold)">Grande finale</div>${final.length?final.map(pilot=>`<div class="mini-pilot" onclick="openProfile(${pilot.id})">${avatar(pilot,26)} ${esc(pilot.tag)} <span class="muted">${pilot.fr?ordinal(pilot.fr):""}</span></div>`).join(""):`<span class="muted">En attente des vainqueurs</span>`}</div></div><span class="arrow">→</span><div class="champion-box"><div style="font-size:28px">♛</div><div class="eyebrow" style="color:var(--gold)">Champion</div>${champion?`<div onclick="openProfile(${champion.id})">${avatar(champion,64)}<div class="champion-name">${esc(champion.tag)}</div></div>`:`<div class="muted" style="margin-top:8px">À déterminer</div>`}</div></div></div></div>`;
    }

    function renderFinal() {
      const final = finalists();
      if (final.length < 2) return `<div class="empty">Désignez au moins deux vainqueurs de salon pour constituer la finale.</div>`;
      return `<div class="card" id="finalCard"><div class="card-head"><div><div class="eyebrow">Phase finale</div><h1>Grande finale · Top 5</h1></div><button class="btn small cyan no-capture" onclick="capture('finalCard','finale-rn42')">Capture PNG</button></div><p class="muted">Les vainqueurs sont complétés par les meilleurs deuxième places.</p><div class="final-list">${final.map(pilot=>`<div class="slot">${avatar(pilot,40)}<span class="tag">${esc(pilot.tag)}<br><small class="muted">Salon ${salonIndex(pilot.id)+1}</small></span>${admin?`<select onchange="setResult(${pilot.id},'fr',this.value)"><option value="">Place</option>${final.map((_,n)=>`<option ${pilot.fr===n+1?"selected":""} value="${n+1}">${ordinal(n+1)}</option>`).join("")}</select><input aria-label="Chrono final" placeholder="0:00.0" value="${esc(pilot.ft)}" onchange="setResult(${pilot.id},'ft',this.value)">`:`<span class="rank-badge ${pilot.fr===1?"gold":""}">${ordinal(pilot.fr)}</span><span class="muted">${esc(pilot.ft||"—")}</span>`}</div>`).join("")}</div>${admin?`<div class="no-capture" style="margin-top:14px"><button class="btn primary" onclick="validatePodium()">Valider le podium officiel</button></div>`:""}</div>`;
    }
    function validatePodium() {
      const final=finalists();
      if (final.length<2) return toast("La finale n’est pas complète");
      const places=final.map(pilot=>pilot.fr).filter(Boolean);
      if (places.length!==final.length || new Set(places).size!==places.length) return toast("Attribuez une place unique à chaque finaliste");
      if (places.some(place=>place<1||place>final.length)) return toast("Classement invalide");
      state.validated=true; state.final=true; save(); go(4);
      if (window.confetti) {
        confetti({particleCount:130,spread:75,origin:{x:.2,y:.7},colors:["#ff3b54","#65e8ff","#ffc857"]});
        setTimeout(()=>confetti({particleCount:130,spread:75,origin:{x:.8,y:.7},colors:["#ff3b54","#65e8ff","#ffc857"]}),220);
      }
      toast("Podium officiel validé");
    }

    function ranking() {
      const final=finalists();
      return [...state.pilots].sort((a,b)=> {
        const key=pilot=>{
          if(state.validated&&final.some(p=>p.id===pilot.id)&&pilot.fr) return [0,pilot.fr,parseTime(pilot.ft)];
          if(final.some(p=>p.id===pilot.id)) return [1,0,parseTime(pilot.st)];
          return [2,pilot.sr||99,parseTime(pilot.st)];
        };
        const av=key(a),bv=key(b);
        return av[0]-bv[0]||av[1]-bv[1]||av[2]-bv[2];
      });
    }
    function pilotStatus(pilot) {
      const final=finalists();
      if(state.validated&&pilot.fr&&final.some(p=>p.id===pilot.id)) return pilot.fr===1?"Champion":"Finaliste · "+ordinal(pilot.fr);
      if(final.some(p=>p.id===pilot.id)) return "Qualifié pour la finale";
      if(!state.salons.length) return "Inscrit";
      return pilot.sr?"Qualifié":"Éliminé";
    }
    function renderPodium() {
      if (!state.validated) return `<div class="empty">Le podium officiel apparaîtra après validation de la finale.</div>`;
      const final=finalists().sort((a,b)=>(a.fr||99)-(b.fr||99));
      const order=[2,1,3];
      return `<div class="card" id="podiumCard"><div class="card-head"><div><div class="eyebrow">Résultat officiel</div><h1>Podium</h1></div><button class="btn small cyan no-capture" onclick="capture('podiumCard','podium-rn42')">Télécharger PNG</button></div><div class="podium">${order.map(place=>{
        const pilot=final.find(p=>p.fr===place); if(!pilot)return "";
        const style=place===1?["gold","150px"]:place===2?["silver","110px"]:["bronze","80px"];
        return `<div class="step"><div onclick="openProfile(${pilot.id})">${avatar(pilot,76)}<div class="pilot-name" style="margin-top:7px">${esc(pilot.tag)}</div><div class="muted">${esc(pilot.ft||"—")}</div></div><div class="block ${style[0]}" style="height:${style[1]}">${place}</div></div>`;
      }).join("")}</div></div><div class="card" style="margin-top:14px" id="rankingCard"><div class="card-head"><div><div class="eyebrow">Tournoi complet</div><h2>Classement général</h2></div><button class="btn small cyan no-capture" onclick="capture('rankingCard','classement-rn42')">Télécharger PNG</button></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Pilote</th><th>Salon</th><th>Statut</th><th>Chrono</th></tr></thead><tbody>${ranking().map((pilot,index)=>`<tr onclick="openProfile(${pilot.id})" style="cursor:pointer"><td>${index+1}</td><td><div class="row" style="flex-wrap:nowrap">${avatar(pilot,30)}<b>${esc(pilot.tag)}</b></div></td><td>${salonIndex(pilot.id)>=0?salonIndex(pilot.id)+1:"—"}</td><td>${pilotStatus(pilot)}</td><td>${esc(pilot.fr?pilot.ft||"—":pilot.st||"—")}</td></tr>`).join("")}</tbody></table></div></div>`;
    }

    function openProfile(id) {
      const pilot=pilotById(id); if(!pilot)return;
      const salon=salonIndex(id);
      const rank=pilot.fr?ordinal(pilot.fr)+" (finale)":pilot.sr?ordinal(pilot.sr)+" (salon)":"—";
      $("#modal").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal profile-modal"><div class="eyebrow" style="color:var(--red)">Fiche pilote</div>${avatar(pilot,104)}<div class="pilot-name" style="font-size:22px">${esc(pilot.tag)}</div><div class="muted">${esc(pilot.name)}</div><dl class="profile-grid"><dt>Statut</dt><dd>${pilotStatus(pilot)}</dd><dt>Salon</dt><dd>${salon>=0?salon+1:"—"}</dd><dt>Rang</dt><dd>${rank}</dd><dt>Chrono</dt><dd>${esc(pilot.ft||pilot.st||"—")}</dd></dl><div class="modal-actions" style="justify-content:center"><button class="btn primary no-capture" onclick="captureProfile(${pilot.id})">Télécharger PNG</button><button class="btn" onclick="closeModal()">Fermer</button></div></div></div>`;
    }
    function captureProfile(id) {
      const pilot=pilotById(id);
      if(!pilot)return;
      $("#modal").innerHTML=`<div class="modal-backdrop"><div class="modal profile-modal" id="profileCapture"><div class="eyebrow" style="color:var(--red)">RN42 Live · Fiche pilote</div>${avatar(pilot,104)}<div class="pilot-name" style="font-size:22px">${esc(pilot.tag)}</div><div class="muted">${esc(pilot.name)}</div><dl class="profile-grid"><dt>Statut</dt><dd>${pilotStatus(pilot)}</dd><dt>Salon</dt><dd>${salonIndex(id)>=0?salonIndex(id)+1:"—"}</dd><dt>Rang</dt><dd>${pilot.fr?ordinal(pilot.fr)+" (finale)":pilot.sr?ordinal(pilot.sr)+" (salon)":"—"}</dd><dt>Chrono</dt><dd>${esc(pilot.ft||pilot.st||"—")}</dd></dl></div></div>`;
      setTimeout(()=> {
        capture("profileCapture","pilote-"+pilot.tag.replace(/[^a-zA-Z0-9_-]/g,""));
        setTimeout(closeModal,500);
      },20);
    }
    function capture(id,filename) {
      const element=document.getElementById(id);
      if(!element||!window.html2canvas)return toast("Fonction d’image indisponible");
      element.classList.add("capturing");
      toast("Génération de l’image…");
      html2canvas(element,{backgroundColor:"#090b10",scale:2,useCORS:true,logging:false}).then(canvas=>{
        const link=document.createElement("a"); link.download=filename+".png"; link.href=canvas.toDataURL("image/png"); link.click();
        toast("Image téléchargée");
      }).catch(()=>toast("Impossible de générer l’image")).finally(()=>element.classList.remove("capturing"));
    }

    $("#adminButton").onclick=adminToggle;
    render();
    loadJsonDatabase();
  </script>
</body>
</html>
